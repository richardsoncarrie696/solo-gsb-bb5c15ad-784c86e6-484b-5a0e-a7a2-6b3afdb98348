services:
  impact-analysis:
    build: .
    image: spreadsheet-impact-analysis:latest
    container_name: spreadsheet-impact
    ports:
      - "8000:8000"
    restart: unless-stopped
    # 内存中最多保留 5 个最近上传的工作簿（见 app/main.py MAX_WORKBOOKS）
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
